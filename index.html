<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8B90D4" id="metaThemeColor">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="로마서8장 암송">
  <title>로마서 8장 말씀 암송 · 16주 완성</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
  :root {
    --peri: #8B90D4;
    --peri-deep: #474B9C;
    --peri-soft: #C3C6EC;
    --peri-wash: #EDEEFA;
    --cream: #F7F1DC;
    --cream-deep: #EBDFBB;
    --paper: #FFFFFF;
    --ink: #2F3167;
    --ink-soft: #7A7DAE;
    --gold: #DFA23A;
    --coral: #DC7A72;
    --blank-ok-bg: #E4F1E2;
    --blank-ok-color: #33683C;
    --blank-ok-border: #5C9E55;
    --blank-no-bg: #FBE7E5;
    --blank-no-color: #A94B44;
    --card-border: var(--peri-wash);
    --r: 22px;
  }

  [data-theme="dark"] {
    --peri: #6368A6;
    --peri-deep: #9094DC;
    --peri-soft: #3D4068;
    --peri-wash: #252843;
    --cream: #141524;
    --cream-deep: #212338;
    --paper: #1B1C2E;
    --ink: #EEF0FD;
    --ink-soft: #9BA0CE;
    --gold: #F1B24B;
    --coral: #E6827A;
    --blank-ok-bg: #1B3522;
    --blank-ok-color: #8CE098;
    --blank-ok-border: #427A4B;
    --blank-no-bg: #3D1F1F;
    --blank-no-color: #FFAAA3;
    --card-border: #2D3050;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    padding: 0 0 70px;
    transition: background-color .25s ease, color .25s ease;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 2px 8px;
  }
  .app-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .theme-btn {
    background: var(--paper);
    border: 2px solid var(--card-border);
    color: var(--ink);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  /* Hero Section */
  .hero {
    position: relative;
    margin: 8px 0 16px;
    border-radius: 24px;
    overflow: hidden;
    background: var(--peri);
    color: #fff;
    padding: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,.08);
  }
  .hero-kicker { font-size: 13px; color: #EDEEFA; }
  .hero-title {
    font-family: "Gaegu", cursive;
    font-weight: 700;
    font-size: 32px;
    line-height: 1.2;
    margin: 4px 0 10px;
  }
  .progress-bg {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.25);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--gold);
    border-radius: 999px;
    transition: width .3s ease;
  }
  .hero-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-top: 6px;
    color: #EDEEFA;
  }

  /* Week Grid List */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .w-btn {
    background: var(--paper);
    border: 2px solid var(--card-border);
    border-radius: 16px;
    padding: 12px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    transition: transform .1s;
  }
  .w-btn:active { transform: scale(.96); }
  .w-btn.done {
    background: var(--blank-ok-bg);
    border-color: var(--blank-ok-border);
    color: var(--blank-ok-color);
  }
  .w-btn .w-num {
    font-family: "Gaegu", cursive;
    font-size: 18px;
    font-weight: 700;
  }
  .w-btn .w-range {
    font-size: 11px;
    color: var(--ink-soft);
  }
  .w-btn.done .w-range {
    color: var(--blank-ok-color);
  }

  /* Practice View Elements */
  .back-btn {
    background: none;
    border: none;
    color: var(--peri-deep);
    font-size: 14.5px;
    font-weight: 700;
    padding: 10px 0;
    cursor: pointer;
  }

  .sec-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 14px 4px 6px;
  }
  .sec-label {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .card {
    background: var(--paper);
    border-radius: var(--r);
    padding: 18px;
    border: 2px solid var(--card-border);
  }
  .placeholder-card {
    text-align: center;
    padding: 24px 16px;
    color: var(--ink-soft);
    font-size: 13.5px;
    background: var(--paper);
    border: 2px dashed var(--card-border);
  }

  .verse-row {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--card-border);
    align-items: baseline;
  }
  .verse-row:last-child { border-bottom: none; }
  .v-num {
    font-family: "Gaegu", cursive;
    font-weight: 700;
    font-size: 19px;
    color: var(--peri-deep);
    min-width: 18px;
    text-align: right;
    flex: none;
  }
  .v-txt {
    font-family: "Gowun Dodum", serif;
    font-size: 16px;
    line-height: 1.95;
    flex: 1;
  }

  button { font-family: inherit; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--peri-deep);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 700;
    width: 100%;
    cursor: pointer;
  }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: var(--peri-wash); color: var(--ink); }
  .btn.cream { background: var(--cream-deep); color: var(--ink); }
  .btn.sm { padding: 6px 12px; font-size: 12px; border-radius: 10px; width: auto; font-weight: 700; }
  .row { display: flex; gap: 8px; margin-top: 10px; }

  .levels { display: flex; gap: 6px; margin: 16px 0 12px; }
  .lv-btn {
    flex: 1;
    border-radius: 12px;
    border: 2px solid var(--card-border);
    background: var(--paper);
    padding: 8px 2px;
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .lv-btn.on { background: var(--peri-deep); border-color: var(--peri-deep); color: #fff; }

  .blank {
    display: inline-block;
    font-family: "Gowun Dodum", serif;
    font-size: 16px;
    border: none;
    border-bottom: 2.5px solid var(--peri);
    background: var(--peri-wash);
    border-radius: 6px 6px 0 0;
    padding: 1px 4px;
    margin: 0 1px;
    color: var(--ink);
    text-align: center;
    min-width: 2.6em;
  }
  .blank.ok { background: var(--blank-ok-bg); border-bottom-color: var(--blank-ok-border); color: var(--blank-ok-color); }
  .blank.no { background: var(--blank-no-bg); border-bottom-color: var(--coral); color: var(--blank-no-color); text-decoration: line-through; }
  .fix { color: var(--coral); font-size: 13px; margin-left: 3px; font-weight: 700; }
  .score-box { background: var(--cream-deep); border-radius: 16px; padding: 12px; text-align: center; margin-bottom: 12px; }
  .score-box b { font-family: "Gaegu", cursive; font-size: 32px; display: block; }

  textarea {
    width: 100%;
    min-height: 160px;
    border: 2px solid var(--card-border);
    border-radius: 16px;
    padding: 12px;
    font-family: "Gowun Dodum", serif;
    font-size: 15px;
    line-height: 1.8;
    color: var(--ink);
    background: var(--paper);
    resize: vertical;
  }

  .nav-bar {
    display: flex;
    gap: 8px;
    margin-top: 24px;
    padding-top: 14px;
    border-top: 2px dashed var(--card-border);
  }
  .backup-box {
    margin-top: 28px;
    padding: 12px 14px;
    background: var(--paper);
    border: 2px solid var(--card-border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <div class="app-name">로마서 8장 암송 프로젝트</div>
    <button class="theme-btn" id="themeToggle">
      <span id="themeIcon">🌙</span> <span id="themeText">다크모드</span>
    </button>
  </div>

  <!-- ===== HOME VIEW ===== -->
  <section id="homeView">
    <div class="hero">
      <div class="hero-kicker">생명의 성령의 법 · 총 39절</div>
      <div class="hero-title">로마서 8장 암송</div>
      <div class="progress-bg">
        <div class="progress-bar" id="pBar" style="width: 0%"></div>
      </div>
      <div class="hero-meta">
        <span id="pText">0 / 16주 완료</span>
        <span id="pRate">0%</span>
      </div>
    </div>

    <!-- 주차 그리드 목록 -->
    <div class="week-grid" id="weekGrid"></div>

    <!-- 백업 바 -->
    <div class="backup-box">
      <span style="font-size:12px;color:var(--ink-soft)">진도 데이터 보관</span>
      <div style="display:flex;gap:6px">
        <button class="btn ghost sm" id="exportBtn">백업 받기</button>
        <button class="btn ghost sm" id="importBtn">불러오기</button>
        <input type="file" id="fileInput" accept=".json" hidden>
      </div>
    </div>
  </section>

  <!-- ===== PRACTICE VIEW ===== -->
  <section id="practiceView" hidden>
    <button class="back-btn" id="backBtn">← 전체 주차 목록</button>

    <div class="hero" style="padding:16px 20px;margin-top:4px">
      <div class="hero-kicker" id="pvKicker">제 1 주차</div>
      <div class="hero-title" id="pvTitle" style="font-size:24px;margin:2px 0 0">로마서 8:1~2</div>
    </div>

    <!-- 편집 화면 -->
    <div id="editCard" hidden>
      <textarea id="editArea"></textarea>
      <div class="row">
        <button class="btn" id="saveBtn">저장하기</button>
        <button class="btn ghost" id="cancelEditBtn">취소</button>
      </div>
    </div>

    <!-- 읽기 및 퀴즈 화면 -->
    <div id="readCard">
      <!-- 본문 헤더 & 가리기 토글 버튼 -->
      <div class="sec-bar">
        <span class="sec-label">📖 말씀 본문</span>
        <button class="btn ghost sm" id="togglePassageBtn">🙈 본문 가리기</button>
      </div>

      <!-- 본문 카드 -->
      <div class="card" id="passageCard"></div>

      <!-- 본문 숨김 시 표시되는 플레이스홀더 -->
      <div class="card placeholder-card" id="passagePlaceholder" hidden>
        <span>🔒 문제가 보이는 동안 본문이 가려졌습니다.</span>
      </div>

      <div class="row">
        <button class="btn ghost" id="editBtn">말씀 고치기</button>
        <button class="btn cream" id="doneBtn">암송 완료로 표시</button>
      </div>

      <div class="sec-bar" style="margin-top:20px">
        <span class="sec-label">✍️ 빈칸 채우기 시험</span>
      </div>

      <div class="levels">
        <button class="lv-btn on" data-lv="0">쉬움 · 25%</button>
        <button class="lv-btn" data-lv="1">보통 · 55%</button>
        <button class="lv-btn" data-lv="2">전체 가리기</button>
      </div>

      <div id="scoreBox" hidden class="score-box">
        <b id="scoreNum">0%</b>
        <span id="scoreMsg"></span>
      </div>

      <div class="card" id="quizCard"></div>

      <div class="row">
        <button class="btn" id="gradeBtn">채점하기</button>
        <button class="btn ghost" id="againBtn">새 문제</button>
      </div>
      <div class="row">
        <button class="btn cream" id="hintBtn">첫 글자 힌트 보기</button>
      </div>
    </div>

    <!-- 하단 네비게이션 -->
    <div class="nav-bar">
      <button class="btn ghost" id="prevBtn">← 이전 주</button>
      <button class="btn ghost" id="nextBtn">다음 주 →</button>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- iOS/Safari 안전 저장소 래퍼 ---------------- */
const SafeStorage = {
  memory: {},
  getItem(k) {
    try { return window.localStorage ? window.localStorage.getItem(k) : (this.memory[k] || null); }
    catch (e) { return this.memory[k] || null; }
  },
  setItem(k, v) {
    try { if (window.localStorage) window.localStorage.setItem(k, v); } catch (e) {}
    this.memory[k] = String(v);
  }
};

  {
    week: 12, range: "28~30절",
    text: "28 우리가 알거니와 하나님을 사랑하는 자 곧 그의 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라\n29 하나님이 미리 아신 자들을 또한 그 아들의 형상을 본받게 하기 위하여 미리 정하셨으니 이는 그로 많은 형제 중에서 맏아들이 되게 하려 하심이니라\n30 또 미리 정하신 그들을 또한 부르시고 부르신 그들을 또한 의롭다 하시고 의롭다 하신 그들을 또한 영화롭게 하셨느니라"
  },
  {
    week: 13, range: "31~32절",
    text: "31 그런즉 이 일에 대하여 우리가 무슨 말 하리요 만일 하나님이 우리를 위하시면 누가 우리를 대적하리요\n32 자기 아들을 아끼지 아니하시고 우리 모든 사람을 위하여 내주신 이가 어찌 그 아들과 함께 모든 것을 우리에게 주시지 아니하겠느냐"
  },
  {
    week: 14, range: "33~34절",
    text: "33 누가 능히 하나님께서 택하신 자들을 고발하리요 의롭다 하신 이는 하나님이시니\n34 누가 정죄하리요 죽으실 뿐 아니라 다시 살아나신 이는 그리스도 예수시니 그는 하나님 우편에 계신 자요 우리를 위하여 간구하시는 자시니라"
  },
  {
    week: 15, range: "35~37절",
    text: "35 누가 우리를 그리스도의 사랑에서 끊으리요 환난이나 곤고나 박해나 기근이나 적신이나 위험이나 칼이랴\n36 기록된 바 우리가 종일 주를 위하여 죽임을 당하게 되며 도살 당할 양 같이 여김을 받았나이다 함과 같으니라\n37 그러나 이 모든 일에 우리를 사랑하시는 이로 말미암아 우리가 넉넉히 이기느니라"
  },
  {
    week: 16, range: "38~39절",
    text: "38 내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나 장래 일이나 능력이나\n39 높음이나 깊음이나 다른 어떤 피조물이라도 우리를 우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 끊을 수 없으리라"
  }
];

/* ---------------- 상태 관리 ---------------- */
const STORAGE_KEY = 'romans8_recite_v3';
let curWeekIdx = 0;
let level = 0;
let quiz = [];
let graded = false;
let isPassageHidden = false;

let D = { weeks: {} };

const $ = id => document.getElementById(id);
const toast = m => {
  const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(t._x); t._x = setTimeout(() => t.classList.remove('show'), 1600);
};

function loadData() {
  const raw = SafeStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { D = JSON.parse(raw); } catch(e) { D = { weeks: {} }; }
  }
  if (!D || !D.weeks) D = { weeks: {} };
  renderHome();
}

function saveData() {
  SafeStorage.setItem(STORAGE_KEY, JSON.stringify(D));
}

function getWeekData(idx) {
  const def = ROMANS8_DATA[idx];
  if (!D.weeks[idx]) {
    D.weeks[idx] = { done: false, best: 0, text: def.text };
  } else if (!D.weeks[idx].text) {
    D.weeks[idx].text = def.text;
  }
  return D.weeks[idx];
}

/* ---------------- 홈 렌더링 ---------------- */
function renderHome() {
  let doneCount = 0;
  ROMANS8_DATA.forEach((_, idx) => {
    if (D.weeks[idx]?.done) doneCount++;
  });

  const pct = Math.round((doneCount / ROMANS8_DATA.length) * 100) || 0;
  $('pBar').style.width = pct + '\%';$('pText').textContent = `${doneCount} / ${ROMANS8_DATA.length}주 완료`;
  $('pRate').textContent = `${pct}%`;

  const gridEl = $('weekGrid');
  gridEl.innerHTML = '';

  ROMANS8_DATA.forEach((item, idx) => {
    const wData = getWeekData(idx);
    const btn = document.createElement('button');
    btn.className = 'w-btn' + (wData.done ? ' done' : '');
    btn.innerHTML = `
      <span class="w-num">${item.week}주 ${wData.done ? '✓' : ''}</span>
      <span class="w-range">${item.range}</span>
    `;
    btn.onclick = () => openPractice(idx);
    gridEl.appendChild(btn);
  });
}

/* ---------------- 연습 화면 ---------------- */
function openPractice(idx) {
  curWeekIdx = idx;
  graded = false;
  $('homeView').hidden = true;
  $('practiceView').hidden = false;
  window.scrollTo(0, 0);

  const item = ROMANS8_DATA[curWeekIdx];
  $('pvKicker').textContent = `제 ${item.week} 주차`;
  $('pvTitle').textContent = `로마서 8:${item.range}`;

  showRead();
}

function updatePassageVisibility() {
  $('passageCard').hidden = isPassageHidden;
  $('passagePlaceholder').hidden = !isPassageHidden;
  $('togglePassageBtn').textContent = isPassageHidden ? '👁️ 본문 보기' : '🙈 본문 가리기';
}

function showRead() {
  $('editCard').hidden = true;
  $('readCard').hidden = false;

  const wData = getWeekData(curWeekIdx);
  const vs = parseText(wData.text);

  $('passageCard').innerHTML = vs.map(v => 
    `<div class="verse-row"><div class="v-num">${v.n}</div><div class="v-txt">${esc(v.t)}</div></div>`
  ).join('');

  $('doneBtn').textContent = wData.done ? '암송 완료 취소' : '암송 완료로 표시';

  updatePassageVisibility();
  buildQuiz();
}

function showEdit() {
  $('editCard').hidden = false;
  $('readCard').hidden = true;
  const wData = getWeekData(curWeekIdx);
  $('editArea').value = wData.text;
}

const esc = s => s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));

function parseText(text) {
  const out = [];
  let lastNum = 1;
  text.split(/\n+/).forEach(line => {
    const s = line.trim(); if (!s) return;
    const m = s.match(/^(\d{1,3})[.)\s]\s*(.+)$/);
    if (m) {
      lastNum = +m[1];
      out.push({ n: lastNum, t: m[2].trim() });
    } else if (out.length) {
      out[out.length - 1].t += ' ' + s;
    } else {
      out.push({ n: lastNum, t: s });
    }
  });
  return out;
}

/* ---------------- 빈칸 채우기 퀴즈 ---------------- */
const RATIO = [.25, .55, 1];
const norm = s => (s || '').replace(/[^0-9\p{L}]/gu, '');

function buildQuiz() {
  graded = false;
  $('scoreBox').hidden = true;
  $('gradeBtn').textContent = '채점하기';

  const wData = getWeekData(curWeekIdx);
  const vs = parseText(wData.text);
  quiz = []; let id = 0;

  const html = vs.map(v => {
    const toks = v.t.split(/\s+/);
    const idx = toks.map((t, k) => k).filter(k => toks[k].replace(/[^\p{L}]/gu, '').length >= 2);
    const want = Math.max(1, Math.round(idx.length * RATIO[level]));
    const pick = new Set(shuffle(idx.slice()).slice(0, want));
    const line = toks.map((t, k) => {
      if (!pick.has(k)) return esc(t);
      const q = { id: id++, ans: t }; quiz.push(q);
      return `<input class="blank" id="b${q.id}" data-q="${q.id}" style="width:${Math.max(2.8, t.length * 1.05)}em" autocomplete="off" aria-label="빈칸">`;
    }).join(' ');
    return `<div class="verse-row"><div class="v-num">${v.n}</div><div class="v-txt">${line}</div></div>`;
  }).join('');

  $('quizCard').innerHTML = html;
  $('quizCard').querySelectorAll('.blank').forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const all = [...$('quizCard').querySelectorAll('.blank')];
        const i = all.indexOf(el);
        if (all[i + 1]) all[i + 1].focus(); else el.blur();
      }
    });
  });
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function grade() {
  if (!quiz.length) return;
  let ok = 0;
  quiz.forEach(q => {
    const el = $('b' + q.id); if (!el) return;
    const right = norm(el.value) === norm(q.ans);
    if (right) ok++;
    const span = document.createElement('span');
    span.className = 'blank ' + (right ? 'ok' : 'no');
    span.style.width = el.style.width;
    span.textContent = el.value || ' ';
    el.replaceWith(span);
    if (!right) {
      const f = document.createElement('span');
      f.className = 'fix';
      f.textContent = q.ans;
      span.after(f);
    }
  });

  graded = true;
  $('gradeBtn').textContent = '다시 풀기';
  const pct = Math.round((ok / quiz.length) * 100);
  $('scoreNum').textContent = pct + '\%';$('scoreMsg').textContent = `${quiz.length}개 중 ${ok}개 정답` + (pct === 100 ? ' · 완벽합니다! ✨' : '');
  $('scoreBox').hidden = false;

  const wData = getWeekData(curWeekIdx);
  if (pct > (wData.best || 0)) { wData.best = pct; saveData(); }
  $('scoreBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---------------- 이벤트 리스너 ---------------- */
$('backBtn').onclick = () => {$('practiceView').hidden = true;
  $('homeView').hidden = false;
  renderHome();
  window.scrollTo(0, 0);
};

// 본문 접기/펼치기 버튼 동작
$('togglePassageBtn').onclick = () => {
  isPassageHidden = !isPassageHidden;
  updatePassageVisibility();
};

$('editBtn').onclick = showEdit;
$('cancelEditBtn').onclick = showRead;
$('saveBtn').onclick = () => {
  const t = $('editArea').value.trim();
  if (!t) { toast('말씀을 입력해주세요.'); return; }
  const wData = getWeekData(curWeekIdx);
  wData.text = t;
  saveData();
  showRead();
  toast('저장 완료');
};

$('doneBtn').onclick = () => {
  const wData = getWeekData(curWeekIdx);
  wData.done = !wData.done;
  saveData();
  $('doneBtn').textContent = wData.done ? '암송 완료 취소' : '암송 완료로 표시';
  toast(wData.done ? '암송을 완료했습니다!' : '완료 표시를 취소했습니다.');
};

document.querySelectorAll('.lv-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.lv-btn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    level = +btn.dataset.lv;
    buildQuiz();
  };
});

$('gradeBtn').onclick = () => { graded ? buildQuiz() : grade(); };
$('againBtn').onclick = () => { buildQuiz(); toast('새 빈칸을 생성했습니다'); };
$('hintBtn').onclick = () => {
  if (graded) { toast('새 문제를 먼저 만들어주세요.'); return; }
  quiz.forEach(q => { const el = $('b' + q.id); if (el && !el.value) el.placeholder = q.ans[0] + '…'; });
  toast('첫 글자 힌트를 표시했습니다');
};

$('nextBtn').onclick = () => {
  if (curWeekIdx + 1 < ROMANS8_DATA.length) {
    curWeekIdx++;
    openPractice(curWeekIdx);
  } else {
    toast('마지막 주차입니다.');
  }
};

$('prevBtn').onclick = () => {
  if (curWeekIdx > 0) {
    curWeekIdx--;
    openPractice(curWeekIdx);
  } else {
    toast('첫 번째 주차입니다.');
  }
};

/* 데이터 백업 / 복원 */
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `로마서8장_암송데이터_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('백업 파일을 다운로드했습니다');
};

$('importBtn').onclick = () => $('fileInput').click();$('fileInput').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const data = JSON.parse(evt.target.result);
      if (data && data.weeks) {
        D = data; saveData(); renderHome(); toast('데이터를 복원했습니다');
      } else { throw new Error(); }
    } catch(err) {
      toast('올바르지 않은 백업 파일 형식입니다');
    }
  };
  reader.readAsText(file);
};

/* 테마(다크모드) 관리 */
const THEME_KEY = 'romans8_theme';
function getInitialTheme() {
  const saved = SafeStorage.getItem(THEME_KEY);
  if (saved) return saved;
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  catch(e) { return 'light'; }
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  SafeStorage.setItem(THEME_KEY, theme);
  const isDark = theme === 'dark';
  $('themeIcon').textContent = isDark ? '☀️' : '🌙';
  $('themeText').textContent = isDark ? '라이트모드' : '다크모드';
  $('metaThemeColor').setAttribute('content', isDark ? '#141524' : '#8B90D4');
}

$('themeToggle').onclick = () => {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
};

applyTheme(getInitialTheme());
loadData();
</script>
